events {}
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  upstream forgeai_app { server app:8000; }
  server {
    listen 80;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://forgeai_app; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://forgeai_app; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
